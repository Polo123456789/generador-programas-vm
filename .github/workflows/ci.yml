name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check

      - name: Generate GitHub Pages site
        run: bun run generate

      - name: Verify generated assets and base URL
        run: bun run verify:generated

      - name: Check whitespace errors
        run: git diff --check

      - name: Verify generated site is committed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- docs)" ]]; then
            echo "docs/ no coincide con la salida de bun run generate:"
            git status --short -- docs
            exit 1
          fi
